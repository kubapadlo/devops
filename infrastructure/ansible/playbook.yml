---
- name: Deploy Kanye Counter App with Traefik
  hosts: Endpoints
  become: yes
  
  vars:
    container_name: "kanye-counter-app"
    image_name: "jpadlo/kanye-counter"
    image_tag: "latest"
    app_port: 3000
    duckdns_domain: "kanye-countdown"     
    letsencrypt_email: "jpadlo@student.agh.edu.pl"

  tasks:

    # ── CZYSZCZENIE I INSTALACJA DOCKERA ─────────────────────────────

    - name: Usuń stare wersje Dockera (jeśli istnieją)
      ansible.builtin.apt:
        name: [docker.io, docker-doc, docker-compose, podman-docker, containerd, runc]
        state: absent

    - name: Zainstaluj wymagane pakiety pomocnicze
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, python3-docker]
        state: present
        update_cache: yes

    - name: Dodaj klucz GPG Dockera
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Dodaj oficjalne repozytorium Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Zainstaluj Docker CE
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io]
        state: present
        update_cache: yes

    - name: Uruchom Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # ── DUCKDNS IP UPDATE ────────────────────────────────────────────

    - name: Aktualizuj adres IP w DuckDNS
      ansible.builtin.get_url:
        url: "https://www.duckdns.org/update?domains={{ duckdns_domain }}&token={{ duckdns_token }}&ip="
        dest: /tmp/duckdns_update.log

    # ── KONFIGURACJA TRAEFIK ─────────────────────────────────────────

    - name: Utwórz katalogi
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop: [/opt/traefik, /opt/traefik/config]

    - name: Utwórz acme.json
      ansible.builtin.file:
        path: /opt/traefik/acme.json
        state: touch
        mode: '0600'

    - name: Wgraj traefik.yml
      ansible.builtin.copy:
        dest: /opt/traefik/traefik.yml
        content: |
          api:
            dashboard: false
          entryPoints:
            web:
              address: ":80"
              http:
                redirections:
                  entryPoint:
                    to: websecure
                    scheme: https
            websecure:
              address: ":443"
          certificatesResolvers:
            duckdns:
              acme:
                email: {{ letsencrypt_email }}
                storage: /acme.json
                dnsChallenge:
                  provider: duckdns
                  delayBeforeCheck: 30
          providers:
            docker:
              exposedByDefault: false
              # Dodajemy wymuszenie wersji API wewnątrz pliku (opcjonalnie)
              endpoint: "unix:///var/run/docker.sock"

    - name: Utwórz sieć proxy
      community.docker.docker_network:
        name: proxy
        state: present

    # ── URUCHOMIENIE TRAEFIK (Z FIXEM API) ───────────────────────────

    - name: Uruchom kontener Traefik
      community.docker.docker_container:
        name: traefik
        image: "traefik:v3.3"
        state: started
        restart_policy: unless-stopped
        recreate: yes # Wymuś przeładowanie przy zmianie konfiguracji
        published_ports:
          - "80:80"
          - "443:443"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
          - /opt/traefik/traefik.yml:/traefik.yml:ro
          - /opt/traefik/acme.json:/acme.json
        env:
          DUCKDNS_TOKEN: "{{ duckdns_token }}"
          # KLUCZOWY FIX: Wymuszamy wersję API Dockera
          DOCKER_API_VERSION: "1.41" 
        networks:
          - name: proxy

    # ── APLIKACJA ────────────────────────────────────────────────────

    - name: Pobierz i uruchom aplikację (instancja 1)
      community.docker.docker_container:
        name: "{{ container_name }}-1"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        pull: yes
        networks: [{name: proxy}]
        labels:
          traefik.enable: "true"
          traefik.http.routers.kanye-1.rule: "Host(`{{ duckdns_domain }}.duckdns.org`)"
          traefik.http.routers.kanye-1.entrypoints: "websecure"
          traefik.http.routers.kanye-1.tls.certresolver: "duckdns"
          traefik.http.routers.kanye-1.service: "kanye-service"
          traefik.http.services.kanye-service.loadbalancer.server.port: "{{ app_port }}"

    - name: Uruchom aplikację (instancja 2)
      community.docker.docker_container:
        name: "{{ container_name }}-2"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        networks: [{name: proxy}]
        labels:
          traefik.enable: "true"
          traefik.http.routers.kanye-2.rule: "Host(`{{ duckdns_domain }}.duckdns.org`)"
          traefik.http.routers.kanye-2.entrypoints: "websecure"
          traefik.http.routers.kanye-2.tls.certresolver: "duckdns"
          traefik.http.routers.kanye-2.service: "kanye-service"
          traefik.http.services.kanye-service.loadbalancer.server.port: "{{ app_port }}"

    # ── WERYFIKACJA ──────────────────────────────────────────────────

    - name: Poczekaj na start i sprawdź lokalnie
      ansible.builtin.uri:
        url: "https://127.0.0.1"
        method: GET
        validate_certs: no
        headers:
          Host: "{{ duckdns_domain }}.duckdns.org"
      register: https_check
      retries: 20
      delay: 15
      until: https_check.status == 200
- name: Deploy Kanye Counter App with Nginx + Self-Signed SSL
  hosts: all
  become: yes

  vars:
    container_name: "kanye-counter-app"
    image_name: "jpadlo/kanye-counter"
    image_tag: "latest"
    app_port: 3000
    duckdns_domain: "kanye-countdown"
    fqdn: "{{ duckdns_domain }}.duckdns.org"

  tasks:

    # ── PRZYGOTOWANIE SYSTEMU ────────────────────────────────────────

    - name: Zainstaluj pakiety (Docker, Nginx, OpenSSL)
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, python3-docker, openssl, nginx]
        state: present
        update_cache: yes

    - name: Dodaj klucz GPG Docker
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Dodaj repozytorium Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Zainstaluj Docker CE
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io]
        state: present

    - name: Uruchom Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # ── SSL (SELF-SIGNED) ────────────────────────────────────────────
    # Generujemy certyfikat lokalnie, bo Certbot nie zadziała bez publicznego IP

    - name: Utwórz katalog na certyfikaty
      ansible.builtin.file:
        path: /etc/nginx/ssl
        state: directory
        mode: '0755'

    - name: Wygeneruj certyfikat SSL (ważny 1 rok)
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/nginx/ssl/nginx.key
        -out /etc/nginx/ssl/nginx.crt
        -subj "/C=PL/ST=Malopolska/L=Krakow/O=AGH/CN={{ fqdn }}"
      args:
        creates: /etc/nginx/ssl/nginx.crt

    # ── KONTENERY APLIKACJI ──────────────────────────────────────────

    - name: Utwórz sieć Docker dla proxy
      community.docker.docker_network:
        name: proxy
        state: present

    - name: Uruchom dwie instancje aplikacji (Load Balancing)
      community.docker.docker_container:
        name: "{{ container_name }}-{{ item.name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        pull: yes
        networks:
          - name: proxy
        published_ports:
          - "{{ item.port }}:{{ app_port }}"
      loop:
        - { name: "1", port: 3001 }
        - { name: "2", port: 3002 }

    # ── KONFIGURACJA NGINX ───────────────────────────────────────────

    - name: Wgraj konfigurację Load Balancera (HTTPS)
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/kanye
        content: |
          upstream kanye_backend {
              server 127.0.0.1:3001;
              server 127.0.0.1:3002;
          }

          server {
              listen 80;
              server_name {{ fqdn }};
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              server_name {{ fqdn }};

              ssl_certificate /etc/nginx/ssl/nginx.crt;
              ssl_certificate_key /etc/nginx/ssl/nginx.key;

              location / {
                  proxy_pass http://kanye_backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Aktywuj konfigurację i usuń domyślną
      ansible.builtin.file:
        src: /etc/nginx/sites-available/kanye
        dest: /etc/nginx/sites-enabled/kanye
        state: link

    - name: Usuń default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Zrestartuj Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: yes

    # ── WERYFIKACJA ──────────────────────────────────────────────────

    - name: Sprawdź czy strona odpowiada (lokalnie przez HTTPS)
      ansible.builtin.uri:
        url: "https://127.0.0.1"
        validate_certs: no
        headers:
          Host: "{{ fqdn }}"
      register: result
      until: result.status == 200
      retries: 5
      delay: 5
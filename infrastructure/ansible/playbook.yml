---
- name: Deploy kanye-counter na serwerze produkcyjnym
  hosts: Endpoints
  become: yes
  gather_facts: yes

  vars:
    container_name: "kanye-counter-app"
    image_name: "jpadlo/kanye-counter"
    image_tag: "latest"
    app_port: 3000
    host_port: 3000

  tasks:

    # ── DOCKER ───────────────────────────────────────────────────────

    - name: Zainstaluj Docker i zależności
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: yes

    - name: Uruchom i włącz Docker przy starcie
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # ── DEPLOY KONTENERA ─────────────────────────────────────────────

    - name: Pobierz najnowszy obraz
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: pull
        force_source: yes

    - name: Uruchom kontener
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ host_port }}:{{ app_port }}"
        env:
          NODE_ENV: "production"

    # ── WERYFIKACJA ──────────────────────────────────────────────────

    - name: Poczekaj aż port będzie dostępny
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ host_port }}"
        delay: 5
        timeout: 60

    - name: Sprawdź HTTP
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}"
        method: GET
        status_code: 200
        timeout: 15
      retries: 5
      delay: 5
      until: http_check.status == 200
      register: http_check
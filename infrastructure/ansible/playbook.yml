---
- name: Deploy Kanye Counter App with Traefik
  hosts: Endpoints
  become: yes
  
  vars:
    container_name: "kanye-counter-app"
    image_name: "jpadlo/kanye-counter"
    image_tag: "latest"
    app_port: 3000
    duckdns_domain: "kanye-countdown"     
    letsencrypt_email: "jpadlo@student.agh.edu.pl"

  tasks:

    # ── INSTALACJA DOCKER CE (NAJNOWSZA WERSJA) ──────────────────────

    - name: Zainstaluj pakiety pomocnicze
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, python3-docker]
        state: present
        update_cache: yes

    - name: Dodaj klucz GPG i repozytorium Docker
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Dodaj repozytorium Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Zainstaluj Docker CE
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io]
        state: present

    - name: Uruchom Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # ── DUCKDNS UPDATE ───────────────────────────────────────────────

    - name: Aktualizuj DuckDNS IP
      ansible.builtin.get_url:
        url: "https://www.duckdns.org/update?domains={{ duckdns_domain }}&token={{ duckdns_token }}&ip="
        dest: /tmp/duckdns_update.log

    # ── KONFIGURACJA TRAEFIK (CZYSTA) ────────────────────────────────

    - name: Utwórz katalogi
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop: [/opt/traefik, /opt/traefik/config]

    - name: Utwórz acme.json
      ansible.builtin.file:
        path: /opt/traefik/acme.json
        state: touch
        mode: '0600'

    - name: Wgraj traefik.yml (BEZ POLA VERSION)
      ansible.builtin.copy:
        dest: /opt/traefik/traefik.yml
        content: |
          api:
            dashboard: false
          entryPoints:
            web:
              address: ":80"
              http:
                redirections:
                  entryPoint:
                    to: websecure
                    scheme: https
            websecure:
              address: ":443"
          certificatesResolvers:
            duckdns:
              acme:
                email: {{ letsencrypt_email }}
                storage: /acme.json
                dnsChallenge:
                  provider: duckdns
                  delayBeforeCheck: 30
          providers:
            docker:
              exposedByDefault: false
              endpoint: "unix:///var/run/docker.sock"

    - name: Utwórz sieć proxy
      community.docker.docker_network:
        name: proxy
        state: present

    # ── RESTART TRAEFIKA Z FIXEM API ─────────────────────────────────

    - name: Usuń stary kontener Traefik (wymuszenie czystego startu)
      community.docker.docker_container:
        name: traefik
        state: absent

    - name: Uruchom Traefik (v3.3)
      community.docker.docker_container:
        name: traefik
        image: "traefik:v3.3"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "80:80"
          - "443:443"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
          - /opt/traefik/traefik.yml:/traefik.yml:ro
          - /opt/traefik/acme.json:/acme.json
        env:
          DUCKDNS_TOKEN: "{{ duckdns_token }}"
        groups:
          - "988"
        networks:
          - name: proxy

    # ── APLIKACJA ────────────────────────────────────────────────────

    - name: Uruchom aplikację (instancje 1 i 2)
      community.docker.docker_container:
        name: "{{ container_name }}-{{ item }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        pull: yes
        networks: [{name: proxy}]
        labels:
          traefik.enable: "true"
          traefik.http.routers.kanye-{{ item }}.rule: "Host(`{{ duckdns_domain }}.duckdns.org`)"
          traefik.http.routers.kanye-{{ item }}.entrypoints: "websecure"
          traefik.http.routers.kanye-{{ item }}.tls.certresolver: "duckdns"
          traefik.http.routers.kanye-{{ item }}.service: "kanye-service"
          traefik.http.services.kanye-service.loadbalancer.server.port: "{{ app_port }}"
      loop: [1, 2]

    # ── WERYFIKACJA ──────────────────────────────────────────────────

    - name: Sprawdź lokalnie przez nagłówek Host
      ansible.builtin.uri:
        url: "https://127.0.0.1"
        method: GET
        validate_certs: no
        headers:
          Host: "{{ duckdns_domain }}.duckdns.org"
      register: https_check
      retries: 25
      delay: 15
      until: https_check.status == 200
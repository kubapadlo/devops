---
- name: Deploy Kanye Counter App with Nginx + Certbot
  hosts: Endpoints
  become: yes

  vars:
    container_name: "kanye-counter-app"
    image_name: "jpadlo/kanye-counter"
    image_tag: "latest"
    app_port: 3000
    duckdns_domain: "kanye-countdown"
    letsencrypt_email: "jpadlo@student.agh.edu.pl"
    fqdn: "{{ duckdns_domain }}.duckdns.org"

  tasks:

    # ── INSTALACJA DOCKER CE ─────────────────────────────────────────

    - name: Zainstaluj pakiety pomocnicze
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, python3-docker]
        state: present
        update_cache: yes

    - name: Dodaj klucz GPG Docker
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Dodaj repozytorium Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Zainstaluj Docker CE
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io]
        state: present

    - name: Uruchom Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # ── INSTALACJA NGINX I CERTBOT ───────────────────────────────────

    - name: Zainstaluj nginx i certbot
      ansible.builtin.apt:
        name: [nginx, certbot, python3-certbot-nginx]
        state: present

    # ── DUCKDNS UPDATE ───────────────────────────────────────────────

    - name: Aktualizuj DuckDNS IP
      ansible.builtin.get_url:
        url: "https://www.duckdns.org/update?domains={{ duckdns_domain }}&token={{ duckdns_token }}&ip="
        dest: /tmp/duckdns_update.log

    # ── SIEĆ DOCKER ──────────────────────────────────────────────────

    - name: Utwórz sieć proxy
      community.docker.docker_network:
        name: proxy
        state: present

    # ── APLIKACJA ────────────────────────────────────────────────────

    - name: Zatrzymaj i usuń stare kontenery aplikacji
      community.docker.docker_container:
        name: "{{ container_name }}-{{ item }}"
        state: absent
      loop: [1, 2]

    - name: Uruchom aplikację (instancje 1 i 2)
      community.docker.docker_container:
        name: "{{ container_name }}-{{ item.name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        pull: yes
        networks:
          - name: proxy
        published_ports:
          - "{{ item.port }}:{{ app_port }}"
      loop:
        - { name: "1", port: 3001 }
        - { name: "2", port: 3002 }

    # ── NGINX KONFIGURACJA (HTTP) ─────────────────────────────────────

    - name: Wgraj konfigurację nginx (HTTP - przed certbotem)
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/kanye
        content: |
          upstream kanye_backend {
              server 127.0.0.1:3001;
              server 127.0.0.1:3002;
          }

          server {
              listen 80;
              server_name {{ fqdn }};

              location / {
                  proxy_pass http://kanye_backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Włącz konfigurację nginx
      ansible.builtin.file:
        src: /etc/nginx/sites-available/kanye
        dest: /etc/nginx/sites-enabled/kanye
        state: link

    - name: Usuń domyślną konfigurację nginx
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Przetestuj konfigurację nginx
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Uruchom nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: yes

    # ── CERTBOT (LET'S ENCRYPT) ──────────────────────────────────────

    - name: Pobierz certyfikat SSL przez certbot
      ansible.builtin.command: >
        certbot --nginx
        -d {{ fqdn }}
        --email {{ letsencrypt_email }}
        --agree-tos
        --non-interactive
        --redirect
      args:
        creates: /etc/letsencrypt/live/{{ fqdn }}/fullchain.pem

    - name: Przeładuj nginx po certbocie
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    # ── AUTO-RENEWAL ─────────────────────────────────────────────────

    - name: Włącz certbot timer (auto-renewal)
      ansible.builtin.systemd:
        name: certbot.timer
        state: started
        enabled: yes

    # ── WERYFIKACJA ──────────────────────────────────────────────────

    - name: Sprawdź czy aplikacja odpowiada przez HTTPS
      ansible.builtin.uri:
        url: "https://{{ fqdn }}"
        method: GET
        validate_certs: yes
      register: https_check
      retries: 10
      delay: 10
      until: https_check.status == 200